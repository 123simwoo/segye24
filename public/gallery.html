        quote: "\"꺄악-!! ...하, 하필 천둥이... 야, 절대로 나 비웃지 마... 딱 5분만 이러고 있을 거야!\""

    let currentFilter = "all";
    let currentLightboxIdx = 0;

    function renderGallery(filter = "all") {
      currentFilter = filter;
      const grid = document.getElementById("galleryGrid");
      const list = filter === "all" ? artworks : artworks.filter(a => a.cat === filter);

      grid.innerHTML = list.map((item, idx) => `
        <div class="glow-card bg-[#140e22] border border-white/10 rounded-2xl overflow-hidden flex flex-col group cursor-pointer" onclick="openLightbox(${artworks.indexOf(item)})">
          <div class="relative w-full aspect-[4/5] bg-black/40 overflow-hidden">
            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='/assets/segye_occult/segye_main.jpg';">
            <div class="absolute top-2.5 left-2.5">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-black/75 backdrop-blur-md text-pink-400 border border-pink-500/30">
                ${item.badge}
              </span>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
              <span class="text-xs font-bold text-white flex items-center gap-1">
                <span>🔍 원본 크게 보기</span>
              </span>
            </div>
          </div>
          <div class="p-3.5 flex flex-col flex-1 justify-between gap-2">
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-pink-400 transition-colors line-clamp-1">${item.title}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-2 mt-1 leading-relaxed">${item.desc}</p>
            </div>
            <div class="pt-2 border-t border-white/5 text-[11px] text-pink-300 italic line-clamp-1">
              ${item.quote}
            </div>
          </div>
        </div>
      `).join("");
    }

    function filterGallery(cat) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active-filter"));
      const activeBtn = document.getElementById("btn-" + cat);
      if (activeBtn) activeBtn.classList.add("active-filter");
      renderGallery(cat);
    }

    function openLightbox(idx) {
      currentLightboxIdx = idx;
      const item = artworks[idx];
      if (!item) return;

      document.getElementById("modalBadge").textContent = item.badge;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalImg").src = item.img;
      document.getElementById("modalDesc").textContent = item.desc;
      document.getElementById("modalQuote").textContent = item.quote;

      document.getElementById("lightboxModal").classList.remove("hidden");
    }

    function closeLightbox() {
      document.getElementById("lightboxModal").classList.add("hidden");
    }

    function stepLightbox(dir) {
      currentLightboxIdx = (currentLightboxIdx + dir + artworks.length) % artworks.length;
      openLightbox(currentLightboxIdx);
    }

    document.addEventListener("keydown", e => {
      if (document.getElementById("lightboxModal").classList.contains("hidden")) return;
      if (e.key === "ArrowLeft") stepLightbox(-1);
      if (e.key === "ArrowRight") stepLightbox(1);
      if (e.key === "Escape") closeLightbox();
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderGallery("all");
    });
  </script>
